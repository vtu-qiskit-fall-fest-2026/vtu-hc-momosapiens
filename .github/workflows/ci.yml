name: ShorlyNot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (clean-clone check)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify primary CLI entry point (`python -m src.main`)
        run: |
          python -m src.main

      - name: Run full Pytest suite (Circuits, Attacks, PQC, ROC, E2E Fit)
        run: |
          python -m pytest -v --tb=short

      - name: ROC analysis smoke check
        run: |
          python scripts/roc_benchmark.py
